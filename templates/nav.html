      </div>
      <div class="nav-item-dropdown">
        <a href="/wojownicy/" class="nav-item">My, Wojownicy</a>
        <div class="nav-dropdown-menu">
          <a href="/wojownicy/blachowi/" class="nav-item nav-subitem">Blachowi</a>
          <a href="/wojownicy/niewiasty/" class="nav-item nav-subitem">Niewiasty</a>

      </div>
      <a href="/nabor/" class="nav-item nav-item--highlighted">Nabór</a>
      <a href="/turniej/" class="nav-item">Kruczy Turniej</a>
      <a href="/kontakt/" class="nav-item">Kontakt</a>
      <div class="nav-item-dropdown">
        <button type="button" class="nav-item">Publiczne materiały</button>
        <div class="nav-dropdown-menu">
          <a href="/oferty/" class="nav-item nav-subitem">Oferty handlowe</a>
          <a href="/grafiki/" class="nav-item nav-subitem">Zdjęcia i grafiki</a>
          <a href="/publiczne-materialy/archiwalna-wersja-strony/" class="nav-item nav-subitem">Archiwalna wersja strony</a>
        </div>
      </div>
      <div class="nav-account-area">
        <!-- Strefa Członków's top-nav home: shown on desktop as a folded dropdown (like "O nas"
             above), nested inside .nav-account-area so it can never be split from
             Zaloguj/Wyloguj by the row's flex-wrap - both are pushed to the row's right edge as
             one group by .nav-account-area's own margin-left:auto. On mobile it becomes the
             always-static nested list inside the hamburger (.nav-item-dropdown mobile override),
             independent of the separate header trigger in .members-zone-mobile above. Same
             members-zone-container/member-zone-link/admin-zone-link markup as the other two
             copies, so nav.js's existing generic visibility gating (querySelectorAll across the
             whole DOM) shows/hides this copy the same way with no JS changes. -->
        <div class="nav-item-dropdown members-zone-container" id="members-zone-nav" hidden>
          <button type="button" class="nav-item">
            <span class="members-zone-icon" aria-hidden="true"></span>
            Strefa Członków
          </button>
          <div class="nav-dropdown-menu">
            <div class="members-zone-links" data-members-zone-flavor="nav"></div>
            <button type="button" class="members-zone-install" data-pwa-install aria-describedby="pwa-install-nav-message" hidden>Zainstaluj</button>
            <p class="members-zone-install-message" id="pwa-install-nav-message" data-pwa-install-message role="status" aria-live="polite" hidden></p>
          </div>
        </div>
        <a href="/logowanie/" class="nav-item" id="nav-login-link" hidden>Zaloguj się</a>
        <!-- KRKG-0046: shown/hidden alongside nav-login-link (nav.js's renderAvatar) - visible
             to the same "not currently a recognized member" audience as the login link itself,
             hidden once an active member is signed in. -->
        <a href="/zgloszenie/" class="nav-item" id="nav-apply-link" hidden>Zgłoś się</a>
        <button type="button" class="nav-item" id="nav-logout-link" hidden>Wyloguj się</button>
        <p class="auth-checking nav-auth-checking" id="nav-auth-checking" role="status"><span class="busy-sticker-aura busy-sticker-aura--compact" aria-hidden="true"><img src="/icons/hold-the-line.png" class="busy-sticker busy-sticker--compact" alt=""></span><span class="sr-only">Please hold the line...</span></p>
      </div>
    </nav>
    <div class="header-actions">
      <!-- Strefa Członków's mobile home: an independent expand/collapse trigger, separate from
           the hamburger further along - tapping it opens/closes only this panel, never the
           public menu. Desktop instead shows the equivalent box in the sidebar (see
           social_sidebar.html). Comes before the avatar/hamburger, per the requested order. -->
      <div class="members-zone-mobile members-zone-container" id="members-zone-mobile" hidden>
        <button type="button" class="members-zone-trigger" id="members-zone-trigger" aria-expanded="false" aria-controls="members-zone-panel">
          <span class="members-zone-icon" aria-hidden="true"></span>
          <span class="members-zone-trigger-label">Strefa Członków</span>
        </button>
        <div class="members-zone-panel" id="members-zone-panel" hidden>
          <button type="button" class="members-zone-install" data-pwa-install aria-describedby="pwa-install-mobile-message" hidden>Zainstaluj</button>
          <p class="members-zone-install-message" id="pwa-install-mobile-message" data-pwa-install-message role="status" aria-live="polite" hidden></p>
          <div class="members-zone-links" data-members-zone-flavor="nav"></div>
        </div>
      </div>
      <span class="nav-auth-slot" id="nav-auth-slot"></span>
      <button id="nav-toggle" class="nav-toggle" aria-label="Otwórz menu" aria-expanded="false" aria-controls="main-nav">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
