name: Sync people photos

# Nightly cache of the public people data (About Us categories / member profiles): photos into
# public/people-photos/ and one JSON snapshot per category into public/people-data/, so pages
# serve them as static files instead of calling the backend / Google Drive. Event galleries are NOT part of this. Idempotent: photos are stored under
# content-addressed names (<driveFileId>-<size>-<md5>.<ext>), so a run with nothing new downloads
# nothing and commits nothing. Standalone cron, like sync-facebook.yml. 02:30 UTC = 03:30/04:30
# Polish time. Also runnable on demand: Actions -> "Sync people photos" -> Run workflow.
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      debounce_seconds:
        description: 'Wait this long before reading the data (the backend passes 120 so a burst of edits is picked up by one run)'
        required: false
        default: '0'

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-people-photos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Started by the upload-service right after an admin/member change. Waiting here (rather
      # than in the backend, which Cloud Run may freeze) lets several quick edits land first; the
      # concurrency group above keeps at most one further run queued behind this one.
      - name: Debounce
        if: inputs.debounce_seconds != '' && inputs.debounce_seconds != '0'
        env:
          DEBOUNCE_SECONDS: ${{ inputs.debounce_seconds }}
        run: |
          case "$DEBOUNCE_SECONDS" in (*[!0-9]*) echo "debounce_seconds must be a number"; exit 1;; esac
          sleep "$(( DEBOUNCE_SECONDS > 300 ? 300 : DEBOUNCE_SECONDS ))"

      - name: Sync people photos
        run: npm run sync-people-photos

      - name: Commit generated files
        id: commit
        run: |
          git add -A public/people-photos public/people-data
          if [ -n "$(git status --porcelain public/people-photos public/people-data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: sync people photos"
            for attempt in 1 2 3 4 5; do
              git push && break
              echo "Push rejected (attempt $attempt/5) - rebasing onto latest main and retrying..."
              git pull --rebase origin main
              sleep 3
            done
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "People photos are up to date."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      # pages.yml skips runs authored by github-actions[bot], so the commit above would never be
      # deployed on its own - dispatch it explicitly (same approach as sync-facebook.yml).
      - name: Trigger Pages deploy
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
