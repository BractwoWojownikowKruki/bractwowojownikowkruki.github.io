name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Sync albums metadata
        env:
          DRIVE_API_KEY_SYNC: ${{ secrets.DRIVE_API_KEY_SYNC }}
        run: npm run sync-albums

      - name: Commit generated files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/galerie/data/albums.generated.json public/galerie/covers public/galerie/thumbs
            git commit -m "chore: update generated album metadata"
            # main can easily have moved by now (npm ci/test/sync-albums above take a while,
            # and this repo sees several pushes per session) - a plain `git push` then fails
            # with a non-fast-forward rejection. Rebase onto the latest main and retry a few
            # times instead of failing the whole run over an unrelated, already-landed commit.
            for attempt in 1 2 3 4 5; do
              git push && break
              echo "Push rejected (attempt $attempt/5) - rebasing onto latest main and retrying..."
              git pull --rebase origin main
              sleep 3
            done
          else
            echo "No generated changes to commit"
          fi

      - name: Build site
        # scripts/build-pwa.ts consumes the standard GitHub Actions GITHUB_SHA for cache versioning.
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
