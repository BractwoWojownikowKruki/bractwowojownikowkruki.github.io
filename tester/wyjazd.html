<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tester — Szczegóły wyjazdu</title>
  <link rel="stylesheet" href="../public/style.css">
  <link rel="stylesheet" href="../public/member-area.css">
  <link rel="stylesheet" href="../public/shared/profile-panel.css">
</head>
<body>
  <main class="main-content main-content--flush-top">
    <div class="content-left">
      <section class="content-section content-section--app">
        <div class="lw-topbar lw-topbar--static">
          <div id="lw-nav-container"></div>
          <a href="#" class="lw-nav-add" id="lw-nav-add" onclick="return false">+ Dodaj wyjazd</a>
        </div>

        <h1 id="event-title">Wyjazd Sokoli</h1>

        <div class="lw-meta-row">
          <p id="event-meta">01.01.2027 · 9 zapisanych</p>
          <div class="lw-meta-actions">
            <button type="button" class="lw-edit-toggle" id="event-edit-toggle" aria-expanded="false" aria-controls="event-edit-form">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
              <span>Edytuj</span>
            </button>
            <a href="#" class="audyt-history-btn" title="Historia" aria-label="Historia" onclick="return false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
            </a>
          </div>
        </div>

        <div id="event-edit-form" class="lw-event-edit-form" hidden>
          <div class="field">
            <label for="edit-event-name">Nazwa</label>
            <input type="text" id="edit-event-name" value="Wyjazd Sokoli">
          </div>
          <div class="field">
            <label for="edit-event-date">Data rozpoczęcia</label>
            <input type="date" id="edit-event-date" value="2027-01-01">
          </div>
          <div class="field">
            <label for="edit-event-description">Opis</label>
            <textarea id="edit-event-description" rows="4" placeholder="Informacje o wyjeździe: miejsce, linki, co zabrać...">Zbiórka na parkingu leśnym o 9:00. Link do mapy: https://maps.example.com/sokoli</textarea>
          </div>
          <div class="lw-event-edit-actions">
            <button type="button" class="add-album-submit" id="event-edit-save">Zapisz</button>
            <button type="button" class="btn-cancel" id="event-edit-cancel">Anuluj</button>
          </div>
          <div class="lw-event-edit-danger-row">
            <button type="button" class="btn-cancel" id="cancel-event-btn">Odwołaj wyjazd</button>
          </div>
        </div>

        <div id="skladka-fee-panel">
          <div class="lw-fee-summary">
            <span id="skladka-fee-display">Składka: 120 zł, termin do 15.12.2026</span>
            <button type="button" class="lw-edit-toggle" id="skladka-edit-toggle" aria-expanded="false" aria-controls="skladka-fee-edit">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
              <span>Edytuj</span>
            </button>
            <a href="#" class="audyt-history-btn" id="skladka-fee-history-link" title="Historia składki" aria-label="Historia składki" onclick="return false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
            </a>
          </div>
          <div id="skladka-fee-edit" class="lw-fee-edit" hidden>
            <div class="field">
              <label for="skladka-fee-input">Kwota / opis składki</label>
              <input type="text" id="skladka-fee-input" value="120 zł" placeholder="np. 50 zł / 25 zł dzieci">
            </div>
            <div class="field">
              <label for="skladka-fee-duedate-input">Termin płatności</label>
              <input type="date" id="skladka-fee-duedate-input" value="2026-12-15">
            </div>
            <div class="lw-fee-actions">
              <button type="button" id="skladka-fee-save" class="add-album-submit">Zapisz składkę</button>
              <button type="button" id="skladka-fee-remove" class="btn-cancel">Usuń składkę</button>
            </div>
          </div>
        </div>

        <section id="summary-panel">
          <h2>Podsumowanie</h2>
          <div id="summary-content">
            <div class="lw-summary-columns">
              <div>
                <h3>Sekcja</h3>
                <div class="lw-summary-chips">
                  <span class="section-pill lw-summary-chip" data-section="krakow" title="Kraków">KRK<span class="lw-summary-badge lw-summary-badge--ok">3</span></span>
                  <span class="section-pill lw-summary-chip" data-section="warszawa" title="Warszawa">WAW<span class="lw-summary-badge">1</span></span>
                  <span class="section-pill lw-summary-chip" data-section="wroclaw" title="Wrocław">WRO<span class="lw-summary-badge">1</span></span>
                </div>
              </div>
              <div>
                <h3>Typ</h3>
                <div class="lw-summary-chips">
                  <span class="category-name-pill lw-summary-chip" data-category="brokul" title="Brokuł">Brokuł<span class="lw-summary-badge lw-summary-badge--ok">4</span></span>
                  <span class="category-name-pill lw-summary-chip" data-category="kandydat" title="Kandydat">Kandydat<span class="lw-summary-badge">2</span></span>
                  <span class="category-name-pill lw-summary-chip" data-category="thing" title="Thing">Thing<span class="lw-summary-badge">1</span></span>
                </div>
              </div>
              <div>
                <h3>Wg broni</h3>
                <div class="lw-summary-chips">
                  <span class="lw-summary-chip"><span class="lw-weapon-group"><img class="lw-weapon-icon" src="../public/icons/bron-tarcza.png" alt="" width="20" height="20"><span class="lw-weapon-group-label">tarcza</span></span><span class="lw-summary-badge lw-summary-badge--ok">2</span></span>
                  <span class="lw-summary-chip"><span class="lw-weapon-group"><img class="lw-weapon-icon" src="../public/icons/bron-tarcza-wlocznia.png" alt="" width="20" height="20"><span class="lw-weapon-group-label">tarcza / włócznia</span></span><span class="lw-summary-badge">1</span></span>
                  <span class="lw-summary-chip"><span class="lw-weapon-group"><img class="lw-weapon-icon" src="../public/icons/bron-tarcza-topor.png" alt="" width="20" height="20"><span class="lw-weapon-group-label">tarcza / dun</span></span><span class="lw-summary-badge">1</span></span>
                  <span class="lw-summary-chip"><span class="lw-weapon-group"><img class="lw-weapon-icon" src="../public/icons/bron-tarcza-wlocznia-topor.png" alt="" width="20" height="20"><span class="lw-weapon-group-label">tarcza / włócznia / dun</span></span><span class="lw-summary-badge">1</span></span>
                </div>
              </div>
            </div>
          </div>
        </section>

        <p class="add-album-error" id="lw-error" hidden></p>

        <section id="roster-panel">
          <h2>Lista</h2>
          <div class="lw-roster-controls">
            <span class="lw-roster-filter-heading">Pokaż:</span>
            <label class="lw-filter-check">
              <input type="checkbox" id="roster-filter-niezgloszeni" checked>
              <span>Niezgłoszeni</span>
            </label>
            <label class="lw-filter-check">
              <input type="checkbox" id="roster-filter-zgloszeni" checked>
              <span>Zgłoszeni + ja</span>
            </label>
          </div>
          <div class="czl-table-wrap">
            <table class="czl-table" id="roster-table">
              <thead>
                <tr>
                  <th scope="col" class="czl-section-cell" title="Sekcja">S</th>
                  <th scope="col" class="lw-roster-name-cell">Imię i nazwisko</th>
                  <th scope="col">Status</th>
                  <th scope="col">Broń</th>
                  <th scope="col">Zmiana</th>
                </tr>
              </thead>
              <tbody id="roster-content"></tbody>
            </table>
          </div>
        </section>
      </section>
    </div>
  </main>

  <script src="../public/shared/display-name.js"></script>
  <script src="../public/shared/person-pill.js"></script>
  <script src="../public/shared/companion-add.js"></script>
  <script src="../public/shared/lw-nav.js"></script>
  <script>
    const EMPTY = '—';
    const viewerPersonId = 'viewer@example.com';

    const navEvents = [
      { id: 'e1', name: 'Wyjazd Letni', startDate: '2027-05-01', status: 'active' },
      { id: 'e2', name: 'Zimowy Biwak', startDate: '2027-01-15', status: 'active' },
      { id: 'e3', name: 'Wyjazd Sokoli', startDate: '2027-01-01', status: 'active' },
    ];
    let lwNavOpen = false;
    function renderLwNav() {
      document.getElementById('lw-nav-container').innerHTML = window.LwNav.html({
        events: navEvents,
        currentEventId: 'e3',
        open: lwNavOpen,
      });
    }
    document.getElementById('lw-nav-container').addEventListener('click', (e) => {
      if (!e.target.closest('.lw-nav-toggle')) return;
      lwNavOpen = !lwNavOpen;
      renderLwNav();
    });
    renderLwNav();

    const categories = [
      { id: 'kandydat', label: 'Kandydat' },
      { id: 'brokul', label: 'Brokuł' },
      { id: 'bobo', label: 'Bobo' },
      { id: 'niewiasta', label: 'Niewiasta' },
      { id: 'thing', label: 'Thing' },
      { id: 'blacha', label: 'Blacha' },
      { id: 'emeryt', label: 'Emeryt' },
    ];

    const weapons = {
      T: { file: 'bron-tarcza.png', code: 'T', title: 'Tarcza' },
      W: { file: 'bron-wlocznia.png', code: 'W', title: 'Włócznia' },
      TW: { file: 'bron-tarcza-wlocznia.png', code: 'TW', title: 'Tarcza + włócznia' },
      TD: { file: 'bron-tarcza-topor.png', code: 'TD', title: 'Tarcza + dun' },
      TWD: { file: 'bron-tarcza-wlocznia-topor.png', code: 'TWD', title: 'Tarcza + włócznia + dun' },
    };

    const people = [
      { section: 'bydgoszcz', sectionLabel: 'Bydgoszcz', name: 'Bartosz Kowalski', display: 'Borsuk', category: 'brokul', accountless: false, canAdd: true, attending: true, fee: true, paid: true, wpisowePaid: true, dues: 'not_applicable', weapon: 'TWD', changed: '18.09.2026 14:31' },
      { section: 'bydgoszcz', sectionLabel: 'Bydgoszcz', name: 'Antek Kowalski', display: 'Antek', category: 'bobo', accountless: true, attending: true, fee: true, paid: false, wpisowePaid: false, dues: 'unpaid', weapon: 'T', changed: '18.09.2026 14:32' },
      { section: 'bydgoszcz', sectionLabel: 'Bydgoszcz', name: 'Zosia Kowalska', display: 'Zoja', category: 'kandydat', accountless: true, attending: false, wpisowePaid: false, dues: 'unpaid', weapon: 'W', changed: '' },
      { section: 'krakow', sectionLabel: 'Kraków', name: 'Anna Nowak', display: 'Wiedźma', category: 'niewiasta', accountless: false, canAdd: true, attending: true, fee: true, paid: false, wpisowePaid: true, dues: 'unpaid', weapon: 'W', changed: '12.09.2026 09:04' },
      { section: 'warszawa', sectionLabel: 'Warszawa', name: 'Piotr Zieliński', display: 'Zielony', category: 'thing', accountless: false, attending: false, wpisowePaid: false, dues: 'not_applicable', weapon: 'TD', changed: '' },
      { section: 'poznan', sectionLabel: 'Poznań', name: 'Marek Wiśniewski', display: 'Emeryt', category: 'emeryt', accountless: false, attending: true, fee: true, paid: true, wpisowePaid: true, dues: 'not_applicable', weapon: null, changed: '02.09.2026 20:15' },
      { section: 'wroclaw', sectionLabel: 'Wrocław', name: 'Kasia Lewandowska', display: 'Blacha', category: 'blacha', accountless: false, attending: false, fee: true, paid: false, wpisowePaid: true, dues: 'unpaid', weapon: 'TW', changed: '30.08.2026 11:47' },
      { section: 'krakow', sectionLabel: 'Kraków', name: 'Tomasz Kaczmarek', display: 'Kruk', category: 'brokul', accountless: false, attending: true, fee: false, paid: false, wpisowePaid: true, dues: 'not_applicable', weapon: 'TWD', changed: '28.08.2026 17:02' },
      { section: 'czukcze', sectionLabel: 'Czukcze', name: 'Rafał Deaktywowany', display: 'Cichy', category: 'brokul', accountless: false, deleted: true, attending: true, wpisowePaid: false, dues: 'unpaid', weapon: 'T', changed: '01.08.2026 08:00' },
    ];

    function duesBadgesHtml(person) {
      if (person.dues !== 'unpaid' && person.wpisowePaid) return '';
      const wpisowe = !person.wpisowePaid ? '<span class="lw-dues-badge lw-dues-badge--wpisowe" title="Wpisowe nieopłacone">💰<span>wpisowe</span></span>' : '';
      const roczna = person.dues === 'unpaid' ? '<span class="lw-dues-badge lw-dues-badge--roczna" title="Składka roczna nieopłacona">💰<span>roczna</span></span>' : '';
      return '<span class="lw-dues-badges">' + wpisowe + roczna + '</span>';
    }

    function weaponHtml(person) {
      if (!person.weapon) return EMPTY;
      const w = weapons[person.weapon];
      return '<span class="lw-weapon-badge"><img class="lw-weapon-icon" src="../public/icons/' + w.file + '" alt="' + w.title + '" title="' + w.title + '" width="20" height="20"><span class="lw-weapon-code">' + w.code + '</span></span>';
    }

    function nameCellHtml(person) {
      const label = categories.find((c) => c.id === person.category)?.label ?? person.category;
      const pill = personPillHtml({ name: person.display, categoryId: person.category, categoryLabel: label, accountless: person.accountless === true });
      if (person.deleted) return pill;
      if (person.accountless) {
        return '<button type="button" class="profile-trigger" data-person-id="' + person.name + '">' + pill + '</button>';
      }
      return '<button type="button" class="profile-trigger" data-email="' + person.name + '">' + pill + '</button>'
        + '<button type="button" class="profile-trigger profile-trigger--icon-inline" aria-label="Pokaż profil" title="Pokaż profil">'
        + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>'
        + '</button>';
    }

    function statusCellHtml(person) {
      if (person.deleted) {
        return '<span class="lw-attend-static" title="Osoba deaktywowana">' + (person.attending ? 'Jadę' : 'Nie jadę') + '</span>';
      }
      const toggle = '<button type="button" class="lw-attend-toggle" data-attending="' + person.attending + '" aria-pressed="' + person.attending + '">'
        + '<span class="lw-attend-toggle-track" aria-hidden="true"></span>'
        + (person.attending ? 'Jadę' : 'Nie jadę')
        + '</button>';
      const skladka = person.attending && person.fee
        ? '<button type="button" class="lw-skladka-icon" data-paid="' + person.paid + '" title="Składka ' + (person.paid ? 'opłacona' : 'nieopłacona') + ' — kliknij, aby zmienić">💰</button>'
        : '';
      return toggle + skladka;
    }

    function wireToggle(buttonId, panelId) {
      const button = document.getElementById(buttonId);
      const panel = document.getElementById(panelId);
      button.addEventListener('click', () => {
        const expanded = button.getAttribute('aria-expanded') === 'true';
        button.setAttribute('aria-expanded', String(!expanded));
        panel.hidden = expanded;
      });
    }
    wireToggle('event-edit-toggle', 'event-edit-form');
    wireToggle('skladka-edit-toggle', 'skladka-fee-edit');
    document.getElementById('event-edit-cancel').addEventListener('click', () => {
      document.getElementById('event-edit-toggle').setAttribute('aria-expanded', 'false');
      document.getElementById('event-edit-form').hidden = true;
    });

    document.getElementById('roster-content').innerHTML = people.map((person) => {
      const sectionAbbr = { bydgoszcz: 'BDG', czukcze: 'CZU', krakow: 'KRK', poznan: 'POZ', warszawa: 'WAW', wroclaw: 'WRO' }[person.section] ?? '';
      const addCompanion = person.canAdd
        ? window.CompanionAdd.buttonHtml({ ownerPersonId: viewerPersonId, expanded: false })
        : '';
      return '<tr data-section="' + person.section + '">'
        + '<td class="czl-section-cell" title="' + person.sectionLabel + '">' + sectionAbbr + '</td>'
        + '<td class="lw-roster-name-cell">' + nameCellHtml(person) + addCompanion + duesBadgesHtml(person) + '</td>'
        + '<td>' + statusCellHtml(person) + (person.attending && person.fee && person.deleted ? '<span class="lw-skladka-icon" data-paid="' + person.paid + '" title="Składka">💰</span>' : '') + '</td>'
        + '<td class="' + (person.weapon ? '' : 'czl-empty') + '">' + weaponHtml(person) + '</td>'
        + '<td class="lw-status-changed-cell">' + person.changed + '</td>'
        + '</tr>';
    }).join('');
  </script>
</body>
</html>
