<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tester — Lista wyjazdów</title>
  <link rel="stylesheet" href="../public/style.css">
  <link rel="stylesheet" href="../public/member-area.css">
  <link rel="stylesheet" href="../public/shared/profile-panel.css">
</head>
<body>
  <main class="main-content">
    <div class="content-left">
      <section class="content-section content-section--app">
        <h1 id="lw-page-title">Lista wyjazdowa</h1>

        <div id="events-panel">
          <nav class="lw-subnav">
            <a href="#" class="lw-subnav-link lw-subnav-link--active" onclick="return false">Lista wyjazdów</a>
            <a href="#" class="lw-subnav-link" id="lw-subnav-add" onclick="return false">Dodaj wyjazd</a>
            <a href="#" class="lw-subnav-link" onclick="return false">Składki</a>
          </nav>

          <form id="add-event-form" hidden>
            <div class="field">
              <label for="new-event-name">Nazwa</label>
              <input type="text" id="new-event-name" name="name" required>
            </div>
            <div class="field">
              <label for="new-event-date">Data rozpoczęcia</label>
              <input type="date" id="new-event-date" name="startDate" required>
            </div>
            <div class="field">
              <label for="new-event-description">Opis</label>
              <textarea id="new-event-description" name="description" rows="4" placeholder="Informacje o wyjeździe: miejsce, linki, co zabrać..."></textarea>
            </div>
            <p class="add-album-error" id="add-event-error" hidden></p>
            <button type="submit" class="add-album-submit">Utwórz wyjazd</button>
          </form>

          <button type="button" class="btn-cancel" id="toggle-past-events">Pokaż wszystkie (w tym odwołane i przeszłe)</button>
          <p class="add-album-error" id="events-error" hidden></p>
          <div id="events-list"></div>
        </div>
      </section>
    </div>
  </main>

  <script src="../public/shared/display-name.js"></script>
  <script src="../public/shared/person-pill.js"></script>
  <script src="../public/shared/companion-add.js"></script>
  <script>
    document.getElementById('lw-subnav-add').addEventListener('click', () => {
      const form = document.getElementById('add-event-form');
      form.hidden = !form.hidden;
    });

    const viewerPersonId = 'viewer@example.com';
    const categories = [
      { id: 'kandydat', label: 'Kandydat' },
      { id: 'brokul', label: 'Brokuł' },
      { id: 'bobo', label: 'Bobo' },
      { id: 'emeryt', label: 'Emeryt' },
    ];
    const roster = [
      { personId: viewerPersonId, email: viewerPersonId, accountless: false, fullName: 'Bartosz Kowalski', nickname: 'Borsuk', categoryId: 'brokul' },
      { personId: 'kid-1', email: null, accountless: true, ownerPersonId: viewerPersonId, fullName: 'Antek Kowalski', nickname: 'Antek', categoryId: 'bobo' },
      { personId: 'kid-2', email: null, accountless: true, ownerPersonId: viewerPersonId, fullName: 'Zosia Kowalska', nickname: 'Zoja', categoryId: 'kandydat' },
      { personId: 'kid-3', email: null, accountless: true, ownerPersonId: viewerPersonId, fullName: 'Jan Kowalski', nickname: 'Jaś', categoryId: 'brokul' },
    ];
    const signups = [
      { memberEmail: viewerPersonId, attending: true, skladkaPaid: true },
      { memberEmail: 'kid-1', attending: true, skladkaPaid: false },
    ];
    const viewerMember = roster[0];

    const events = [
      { id: 'e1', name: 'Wyjazd Letni', startDate: '2027-05-01', status: 'active', viewerAttending: true, attendingCount: 5 },
      { id: 'e2', name: 'Zimowy Biwak', startDate: '2027-01-15', status: 'active', viewerAttending: false, attendingCount: 3 },
      { id: 'e3', name: 'Wyjazd Sokoli', startDate: '2027-01-01', status: 'active', viewerAttending: true, attendingCount: 2, panelOpen: true },
      { id: 'e4', name: 'Wyprawa Wiosenna', startDate: '2026-04-10', status: 'cancelled', viewerAttending: false, attendingCount: 0 },
      { id: 'e5', name: 'Stary Biwak', startDate: '2025-11-11', status: 'past', viewerAttending: true, attendingCount: 4 },
    ];

    function formatDate(isoDate) {
      const [y, m, d] = isoDate.split('-');
      return d + '.' + m + '.' + y;
    }

    document.getElementById('events-list').innerHTML = events.map((e) => {
      const statusLabel = e.status === 'cancelled' ? ' (odwołany)' : '';
      const addCompanionHtml = e.viewerAttending
        ? window.CompanionAdd.buttonHtml({ ownerPersonId: viewerPersonId, eventId: e.id, expanded: !!e.panelOpen })
        : '';
      const panelHtml = e.panelOpen
        ? '<div class="lw-inline-form lw-event-inline-form">'
          + window.CompanionAdd.panelHtml(viewerMember, { roster, signups, categories })
          + '</div>'
        : '';
      return `
        <div class="lw-event-row">
          <a href="#" class="lw-event-name" onclick="return false">${e.name}${statusLabel}</a>
          <span class="lw-event-date">${formatDate(e.startDate)}</span>
          <span class="lw-event-count">${e.attendingCount} os.</span>
          <div class="lw-event-actions">
            <button type="button" class="lw-attend-toggle" data-event-id="${e.id}" data-attending="${e.viewerAttending}" aria-pressed="${e.viewerAttending}">
              <span class="lw-attend-toggle-track" aria-hidden="true"></span>
              ${e.viewerAttending ? 'Jadę' : 'Nie jadę'}
            </button>
            ${addCompanionHtml}
          </div>
          ${panelHtml}
        </div>`;
    }).join('');
  </script>
</body>
</html>
