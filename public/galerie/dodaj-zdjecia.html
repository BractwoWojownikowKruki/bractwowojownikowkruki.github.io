<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dodaj zdjęcia — Krucze Galery</title>
  <meta name="robots" content="noindex, nofollow" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Dodaj zdjęcia — Krucze Galery" />
  <meta property="og:image" content="https://www.kruki.org/banner-photos/tarcze.jpg" />
  <meta property="og:locale" content="pl_PL" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Dodaj zdjęcia — Krucze Galery" />
  <meta name="twitter:image" content="https://www.kruki.org/banner-photos/tarcze.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="../favicon.png" />
  <link rel="apple-touch-icon" href="../favicon.png" />
  <link rel="stylesheet" href="../style.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <!-- PARTIAL:nav_galerie -->
  <main class="add-album-main">
    <div class="add-album-card">
      <h1 class="add-album-title">Dodaj zdjęcia</h1>
      <p class="add-album-intro" id="gallery-name-intro">Prześlij nowe zdjęcia do tej galerii.</p>

      <div class="upload-signin" id="upload-signin">
        <div id="google-signin-button"></div>
      </div>
      <p class="upload-signed-in" id="upload-signed-in" hidden>
        Zalogowano jako <strong id="upload-signed-in-email"></strong>.
      </p>
      <p class="upload-forbidden" id="upload-forbidden" hidden>
        To konto Google nie ma uprawnień do dodawania zdjęć.
      </p>
      <div class="upload-reauth" id="upload-reauth" hidden>
        <p>Twoja sesja logowania wygasła. Zaloguj się ponownie, aby kontynuować — dotychczasowy postęp przesyłania zostanie zachowany.</p>
        <div id="google-reauth-button"></div>
      </div>

      <section class="add-album-section">
        <div class="upload-success" id="upload-success" hidden>
          <p>Zdjęcia zostały przesłane!</p>
          <a href="#" id="back-to-gallery-link">Wróć do galerii</a>
        </div>

        <form id="upload-form" novalidate>
          <div class="field">
            <label for="upload-files">Zdjęcia</label>
            <input type="file" id="upload-files" name="files" accept="image/*" multiple />
          </div>

          <p class="add-album-error" id="upload-error" hidden></p>

          <div class="upload-progress" id="upload-progress" hidden>
            <p id="upload-progress-text"></p>
            <div class="upload-progress-bar"><div class="upload-progress-bar-fill" id="upload-progress-fill"></div></div>
            <ul class="upload-failed-list" id="upload-failed-list" hidden></ul>
          </div>

          <button type="submit" class="add-album-submit" id="upload-submit-button">Prześlij pliki</button>
        </form>
      </section>
    </div>
  </main>

  <!-- PARTIAL:footer -->

  <script src="../auth.js"></script>
  <script src="../nav.js"></script>
  <script src="dodaj-zdjecia.js"></script>
</body>
</html>
