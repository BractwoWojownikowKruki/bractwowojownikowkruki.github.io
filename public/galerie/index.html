<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galerie - Krucze Galery</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="../favicon.png" />
  <link rel="apple-touch-icon" href="../favicon.png" />
  <link rel="stylesheet" href="../style.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <!-- PARTIAL:nav_galerie -->
  <header class="site-header">
    <a href="../" class="logo-link" aria-label="Krucze Galery — strona główna">
      <picture>
        <source media="(max-width: 600px)" srcset="../logo.png" />
        <img src="../logo-desktop.png" alt="Krucze Galery" class="logo" onerror="this.style.display='none'" />
      </picture>
    </a>
    <div class="toolbar" id="toolbar" hidden>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="search" id="search" placeholder="Szukaj albumów…" autocomplete="off" />
      </div>
      <div class="toolbar-controls">
        <select id="sort" aria-label="Sortowanie">
          <option value="newest">Najnowsze</option>
          <option value="oldest">Najstarsze</option>
          <option value="alpha">A → Z</option>
        </select>
        <div class="count" id="count" aria-live="polite"></div>
        <a href="dodaj-galerie.html" class="btn-add-album">Dodaj galerię</a>
      </div>
    </div>
  </header>

  <!-- Galerie contain personal data (contributor/uploader emails, names, photos), so viewing
       them requires being signed in with the same kruki-group Google account as
       upload/register (KRKG-0031) - shown instead of <main> until that check passes. -->
  <div class="add-album-card galerie-gate" id="galerie-gate">
    <p class="add-album-intro">Tylko dla Bractwa.</p>
    <div class="upload-signin" id="galerie-signin">
      <div id="galerie-google-signin-button"></div>
    </div>
    <p class="upload-forbidden" id="galerie-forbidden" hidden>To konto Google nie ma uprawnień do przeglądania galerii.</p>
    <div class="upload-reauth" id="galerie-reauth" hidden>
      <p>Twoja sesja logowania wygasła. Zaloguj się ponownie, aby zobaczyć galerie.</p>
      <div id="galerie-reauth-button"></div>
    </div>
  </div>

  <main hidden id="galerie-main">
    <div id="view-grid">
      <div class="page-spinner" id="grid-loading"><span class="spinner"></span></div>
      <div id="grid"></div>
      <p class="empty" id="empty" hidden>Nie znaleziono albumów. Spróbuj innego wyszukiwania.</p>
    </div>
    <div id="view-focused" hidden></div>
  </main>

  <!-- PARTIAL:footer -->

  <script src="../auth.js"></script>
  <script src="../nav.js"></script>
  <script src="app.js"></script>
</body>
</html>
