<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bractwo Wojowników Kruki</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <!-- Navigation Header -->
  <header class="site-header site-header--main">
    <a href="/" class="logo-link" aria-label="Bractwo Wojowników Kruki">
      <img src="kruki-logo.png" alt="Kruki" class="logo" />
    </a>
    <button id="nav-toggle" class="nav-toggle" aria-label="Otwórz menu" aria-expanded="false" aria-controls="main-nav">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <nav class="main-nav" id="main-nav">
      <a href="o-nas/" class="nav-item">O nas</a>
      <div class="nav-item-dropdown">
        <a href="wojownicy/" class="nav-item">Wojownicy</a>
        <div class="nav-dropdown-menu">
          <a href="wojownicy/blachowi/" class="nav-item nav-subitem">Blachowi</a>
          <a href="wojownicy/niewiasty/" class="nav-item nav-subitem">Niewiasty</a>
          <a href="wojownicy/kandydaci/" class="nav-item nav-subitem">Kandydaci</a>
          <a href="wojownicy/emeryci/" class="nav-item nav-subitem">Emeryci</a>
        </div>
      </div>
      <a href="nabor/" class="nav-item nav-item--highlighted">Nabór</a>
      <a href="turniej/" class="nav-item">Kruczy Turniej</a>
      <a href="galerie/" class="nav-item">Galerie</a>
      <a href="kontakt/" class="nav-item">Kontakt</a>
      <span class="nav-auth-slot" id="nav-auth-slot" data-admin-href="admin/"></span>
    </nav>
  </header>

  <!-- Banner Carousel -->
  <div class="banner-section">
    <div id="banner-carousel" class="carousel"></div>
  </div>

  <!-- Main Content: Two Column Layout -->
  <main class="main-content">
    <div class="content-left">
      <section class="content-section">
        <h1>Aktualności</h1>
        <div id="facebook-feed" class="facebook-feed">
          <div class="loading-spinner">
            <span class="spinner"></span> Ładowanie postów...
          </div>
        </div>
        <div class="facebook-link-container">
          <a href="https://www.facebook.com/bractwo.kruki/" target="_blank" rel="noopener noreferrer" class="facebook-link-btn">
            >>> ZOBACZ RESZTĘ NA FACEBOOKU <<<
          </a>
        </div>
      </section>
    </div>

    <aside class="content-right">
      <div class="instagram-embed">
        <div id="instagram-feed">
          <div class="loading-spinner">
            <span class="spinner"></span> Ładowanie postów...
          </div>
        </div>
      </div>
      <div class="youtube-embed">
        <div id="youtube-feed">
          <div class="loading-spinner">
            <span class="spinner"></span> Ładowanie filmów...
          </div>
        </div>
      </div>
    </aside>
  </main>

  <footer class="footer">
    Created by <a href="https://www.cardiocanwait.com" target="_blank" rel="noopener noreferrer">CardioCanWait</a>
    for <a href="https://www.kruki.org" target="_blank" rel="noopener noreferrer">Bractwo Wojowników Kruki</a>,
    hosted on <a href="https://github.com/BractwoWojownikowKruki/bractwowojownikowkruki.github.io" target="_blank" rel="noopener noreferrer">GitHub</a>.
  </footer>

  <script src="carousel.js"></script>
  <script src="auth.js"></script>
  <script src="nav.js"></script>
  <script src="facebook-feed.js"></script>
  <script src="youtube-feed.js"></script>
  <script src="instagram-feed.js"></script>
</body>
</html>
