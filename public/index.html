<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bractwo Wojowników Kruki</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Navigation Header -->
  <header class="site-header site-header--main">
    <a href="#" class="logo-link" aria-label="Bractwo Wojowników Kruki">
      <img src="kruki-logo.png" alt="Kruki" class="logo" />
    </a>
    <nav class="main-nav" id="main-nav">
      <a href="/" class="nav-item nav-item--active">O nas</a>
      <a href="/nabor" class="nav-item nav-item--highlighted">Nabór</a>
      <a href="/turniej" class="nav-item">Kruczy Turniej</a>
      <a href="/galerie" class="nav-item">Galerie</a>
      <a href="/oferta" class="nav-item">Oferta</a>
      <a href="/kontakt" class="nav-item">Kontakt</a>
    </nav>
  </header>

  <!-- Banner Carousel -->
  <div class="banner-section">
    <div id="banner-carousel" class="carousel"></div>
  </div>

  <!-- Main Content: Two Column Layout -->
  <main class="main-content">
    <div class="content-left">
      <section class="content-section">
        <h1>Aktualności</h1>
        <div id="facebook-feed" class="facebook-feed">
          <div class="loading-spinner">
            <span class="spinner"></span> Ładowanie postów...
          </div>
        </div>
        <div class="facebook-link-container">
          <a href="https://www.facebook.com/bractwo.kruki/" target="_blank" rel="noopener noreferrer" class="facebook-link-btn">
            >>> ZOBACZ RESZTĘ NA FACEBOOKU <<<
          </a>
        </div>
      </section>
    </div>

    <aside class="content-right">
      <div class="instagram-embed">
        <!-- Instagram embed will be loaded here -->
        <iframe src="https://www.instagram.com/kruki.brotherhood/embed" width="100%" height="600" frameborder="0" scrolling="no" allowtransparency="true"></iframe>
      </div>
    </aside>
  </main>

  <footer class="footer">
    Created by <a href="https://www.cardiocanwait.com" target="_blank" rel="noopener noreferrer">CardioCanWait</a>
    for <a href="https://www.kruki.org" target="_blank" rel="noopener noreferrer">Bractwo Wojowników Kruki</a>,
    hosted on <a href="https://github.com/BractwoWojownikowKruki/krucze-galery" target="_blank" rel="noopener noreferrer">GitHub</a>.
  </footer>

  <script src="carousel.js"></script>
  <script src="nav.js"></script>
  <script src="facebook-feed.js"></script>
</body>
</html>
