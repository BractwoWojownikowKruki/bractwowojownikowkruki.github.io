<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista wyjazdowa - Bractwo Wojowników Kruki</title>
  <meta name="robots" content="noindex, nofollow" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Lista wyjazdowa - Bractwo Wojowników Kruki" />
  <meta property="og:image" content="https://www.kruki.org/banner-photos/tarcze.jpg" />
  <meta property="og:locale" content="pl_PL" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Lista wyjazdowa - Bractwo Wojowników Kruki" />
  <meta name="twitter:image" content="https://www.kruki.org/banner-photos/tarcze.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="../favicon.png" />
  <link rel="apple-touch-icon" href="../favicon.png" />
  <link rel="stylesheet" href="../style.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <!-- PARTIAL:nav -->

  <main class="main-content">
    <div class="content-left">
      <section class="content-section">
        <h1>Lista wyjazdowa</h1>

        <div class="upload-signin" id="signed-out-panel" hidden>
          <p>Zaloguj się kontem Google, aby uzyskać dostęp do Listy wyjazdowej.</p>
          <div id="google-signin-button"></div>
        </div>
        <p class="upload-forbidden" id="forbidden-panel" hidden>
          Brak uprawnień. Ta sekcja jest dostępna tylko dla członków Bractwa.
        </p>

        <!-- The Składki link is repeated in both panels on purpose: payment status is visible to
             every signed-in member (design.md §7/§8), including members who have not filled in
             their Lista Wyjazdowa profile yet - and those are exactly the members whose Wpisowe
             row an accountant most often has to look up. Only #events-panel carried the link
             before, which made the page unreachable for precisely that group. -->
        <div id="no-profile-panel" hidden>
          <p>Uzupełnij najpierw swój profil, aby zapisywać się na wyjazdy.</p>
          <a href="/profil/" class="btn-cancel">Przejdź do profilu</a>
          <a href="skladki/" class="btn-cancel">Składki</a>
        </div>

        <div id="events-panel" hidden>
          <a href="skladki/" class="btn-cancel">Składki</a>
          <button type="button" class="btn-cancel" id="toggle-add-event">Dodaj wyjazd</button>
          <form id="add-event-form" hidden>
            <div class="field">
              <label for="new-event-name">Nazwa</label>
              <input type="text" id="new-event-name" name="name" required />
            </div>
            <div class="field">
              <label for="new-event-date">Data rozpoczęcia</label>
              <input type="date" id="new-event-date" name="startDate" required />
            </div>
            <p class="add-album-error" id="add-event-error" hidden></p>
            <button type="submit" class="add-album-submit">Utwórz wyjazd</button>
          </form>

          <button type="button" class="btn-cancel" id="toggle-past-events">Pokaż wszystkie (w tym odwołane i przeszłe)</button>
          <!-- Failures of the per-row "Jadę/Nie jadę" toggle land here (design.md §9: fail closed
               with a user-facing Polish message). Deliberately outside #events-list, which
               loadEvents() replaces wholesale on every refresh. -->
          <p class="add-album-error" id="events-error" hidden></p>
          <div id="events-list"></div>
        </div>
      </section>
    </div>

    <!-- PARTIAL:social_sidebar -->
  </main>

  <!-- PARTIAL:footer -->

  <script src="../auth.js"></script>
  <script src="../nav.js"></script>
  <script src="../instagram-feed.js"></script>
  <script src="../youtube-feed.js"></script>
  <script src="lista-wyjazdowa.js"></script>
</body>
</html>
