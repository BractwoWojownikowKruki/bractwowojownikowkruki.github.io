<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wyjazd - Lista wyjazdowa - Bractwo Wojowników Kruki</title>
  <meta name="robots" content="noindex, nofollow" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Wyjazd - Lista wyjazdowa - Bractwo Wojowników Kruki" />
  <meta property="og:image" content="https://www.kruki.org/banner-photos/tarcze.jpg" />
  <meta property="og:locale" content="pl_PL" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Wyjazd - Lista wyjazdowa - Bractwo Wojowników Kruki" />
  <meta name="twitter:image" content="https://www.kruki.org/banner-photos/tarcze.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="../../favicon.png" />
  <link rel="apple-touch-icon" href="../../favicon.png" />
  <link rel="stylesheet" href="../../style.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <!-- PARTIAL:nav -->

  <main class="main-content">
    <div class="content-left">
      <section class="content-section">
        <p class="auth-checking" id="lw-checking" role="status"><span class="busy-sticker-aura" aria-hidden="true"><img src="/icons/hold-the-line.png" class="busy-sticker" alt=""></span>Please hold the line...</p>
        <div class="upload-signin" id="signed-out-panel" hidden>
          <p>Zaloguj się kontem Google, aby uzyskać dostęp do Listy wyjazdowej.</p>
          <div id="google-signin-button"></div>
        </div>
        <p class="upload-forbidden" id="forbidden-panel" hidden>
          Brak uprawnień. Ta sekcja jest dostępna tylko dla członków Bractwa.
        </p>

        <div id="main-content" hidden>
          <!-- Same persistent sub-nav on every Lista Wyjazdowa page - "Dodaj wyjazd" links to the
               events list with ?new=1, which its own load logic detects and opens the add-event
               form automatically, since this page has no form of its own to reveal in place. -->
          <nav class="lw-subnav">
            <a href="/lista-wyjazdowa/" class="lw-subnav-link">Lista wyjazdów</a>
            <a href="/lista-wyjazdowa/?new=1" class="lw-subnav-link">Dodaj wyjazd</a>
            <a href="/lista-wyjazdowa/skladki/" class="lw-subnav-link">Składki</a>
          </nav>

          <h1 id="event-title">Wyjazd</h1>
          <p id="event-meta"></p>
          <div id="event-actions">
            <button type="button" id="cancel-event-btn" class="btn-cancel">Odwołaj wyjazd</button>
            <button type="button" id="restore-event-btn" class="btn-cancel" hidden>Przywróć wyjazd</button>
          </div>

          <!-- Fee display is always rendered; the edit controls are only unhidden when the signed-in
               member's role (fetched via /lista-wyjazdowa/my-role) grants canManageSkladki. -->
          <div id="skladka-fee-panel">
            <span id="skladka-fee-display"></span>
            <span id="skladka-fee-edit" hidden>
              <input type="text" id="skladka-fee-input" placeholder="np. 50 zł / 25 zł dzieci" />
              <button type="button" id="skladka-fee-save" class="btn-cancel">Zapisz składkę</button>
            </span>
          </div>

          <!-- Every failed mutation on this page (signup save, cancel/restore, initial load)
               reports here (design.md §9: fail closed with a user-facing Polish message). Sits
               outside #roster-content, which renderRoster() replaces wholesale; showError()
               scrolls it into view since a save button can be far down a long roster. -->
          <p class="add-album-error" id="lw-error" hidden></p>

          <section id="summary-panel">
            <h2>Podsumowanie</h2>
            <div id="summary-content"></div>
          </section>

          <section id="roster-panel">
            <h2>Lista</h2>
            <div class="lw-roster-controls">
              <label>Sortuj wg:
                <select id="roster-sort-select">
                  <option value="section">Sekcja</option>
                  <option value="weapon">Rodzaj broni</option>
                </select>
              </label>
              <label>Pokaż:
                <select id="roster-filter-select">
                  <option value="attending">Tylko zgłoszeni</option>
                  <option value="all">Wszyscy</option>
                </select>
              </label>
            </div>
            <div id="roster-content"></div>
          </section>

          <!-- Sprzęt/osoby towarzyszące (the named "who's bringing what" lists, split out of
               #summary-content) sit below the roster so a member scrolling the page reads
               "who's coming" before "what they're bringing" - and above the audit log, which is
               the least-often-needed section on the page. -->
          <section id="equipment-companions-panel">
            <h2>Sprzęt i osoby towarzyszące</h2>
            <div id="equipment-companions-content"></div>
          </section>

          <!-- <details> gives free, JS-free collapse behaviour, closed by default: the change log
               is the least-often-needed section on this page, and an open, ever-growing list at
               the bottom pushed everything above it down further with every entry. -->
          <details id="audit-log-panel">
            <summary>Historia zmian</summary>
            <ul id="audit-log-content"></ul>
          </details>
        </div>
      </section>
    </div>

    <!-- PARTIAL:social_sidebar -->
  </main>

  <!-- PARTIAL:footer -->

  <script src="../../auth.js"></script>
  <script src="../../nav.js"></script>
  <script src="../../instagram-feed.js"></script>
  <script src="../../youtube-feed.js"></script>
  <script src="wyjazd.js"></script>
</body>
</html>
