          <p>Zaloguj się kontem Google, aby uzyskać dostęp do Listy wyjazdowej.</p>
          <div id="google-signin-button"></div>
        </div>

        <div id="main-content" hidden>
          <h1 id="event-title">Wyjazd</h1>

          <div id="event-actions">
            <button type="button" id="cancel-event-btn" class="btn-cancel">Odwołaj wyjazd</button>

            <h2>Historia zmian</h2>
            <ul id="audit-log-content"></ul>

        </div>
